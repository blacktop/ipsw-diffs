[project]
name = "ipsw-diff-social"
version = "0.1.0"
description = "Publish new ipsw-diff catalog entries to social networks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "authlib==1.7.2",
    "openai==2.54.0",
    "pillow==12.3.0",
    "requests==2.34.2",
]

[project.scripts]
ipsw-diff-social = "ipsw_diff_social.cli:main"

[build-system]
requires = ["uv_build==0.12.6"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
    "ty==0.0.75",
]
